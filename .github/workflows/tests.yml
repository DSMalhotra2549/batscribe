name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # The tests fake the model and audio, so no GPU, ffmpeg or model download is needed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - run: python -m unittest discover tests -v
